name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      instance_name:
        description: "Name tag of the EC2 instance to deploy to (matches the Terraform instance_name used to create it)."
        required: true
        type: string

# Required for GitHub OIDC to work with AWS (SSM deploy) and Fulcio (cosign keyless)
permissions:
  id-token: write
  contents: read
  packages: write

env:
  AWS_REGION: us-east-2
  GHCR_REGISTRY: ghcr.io
  GHCR_REPOSITORY: vjd21/podman-demo
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned to v2.x: cosign v3 stores signatures as an OCI 1.1 referrer using the
      # Sigstore bundle format, which containers/image cannot read -- it resolves only
      # the legacy sha256-<digest>.sig tag. v2 writes that legacy format by default,
      # so podman's policy.json can verify the signature at pull time.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.5'

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::148737623247:role/deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image with Podman
        run: |
          podman build -t ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${{ env.IMAGE_TAG }} .

      - name: Push Image to GHCR
        id: push
        run: |
          podman push --digestfile digest.txt ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"

      # Provenance: externally verifiable against the workflow identity + Rekor.
      - name: Sign the image with Cosign (keyless)
        run: |
          cosign sign --yes ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}@${{ steps.push.outputs.digest }}

      # Enforcement: podman's policy.json can verify a static key natively at pull
      # time, which it cannot do for a keyless workflow identity (the fulcio matcher
      # requires subjectEmail, and these certs carry a URI SAN with no email).
      - name: Sign the image with Cosign (static key)
        env:
          # Stored base64-encoded: a single-line secret cannot lose the PEM
          # line breaks in transit, which yields "invalid pem block".
          COSIGN_PRIVATE_KEY_B64: ${{ secrets.COSIGN_PRIVATE_KEY_B64 }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          export COSIGN_PRIVATE_KEY="$(printf '%s' "$COSIGN_PRIVATE_KEY_B64" | base64 -d)"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}@${{ steps.push.outputs.digest }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws

      - name: Target the requested instance
        run: |
          sed -i "s/tag:Name: .*/tag:Name: ${{ inputs.instance_name }}/" ansible/aws_ec2.yml

      - name: Deploy via Ansible over SSM
        run: |
          ansible-playbook -i ansible/aws_ec2.yml ansible/deploy.yml \
            -e "new_image_ref=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}@${{ steps.push.outputs.digest }}"

name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      instance_name:
        description: "Name tag of the EC2 instance to deploy to (matches the Terraform instance_name used to create it)."
        required: true
        type: string

# id-token is needed twice over: the AWS OIDC role for the SSM deploy, and the
# Sigstore identity token cosign exchanges at Fulcio for a signing certificate.
permissions:
  id-token: write
  contents: read
  packages: write

env:
  AWS_REGION: us-east-2
  GHCR_REGISTRY: ghcr.io
  GHCR_REPOSITORY: vjd21/podman-demo
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Must match the version installed on the host by ansible/deploy.yml so the
      # signature format written here is the format cosign verifies there.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::148737623247:role/deploy-role
          aws-region: ${{ env.AWS_REGION }}

      # Writes credentials to ~/.docker/config.json, which both podman and cosign read.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image with Podman
        run: |
          podman build -t ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${{ env.IMAGE_TAG }} .

      - name: Push Image to GHCR
        id: push
        run: |
          podman push --digestfile digest.txt ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"

      # Keyless: the workflow's OIDC token is exchanged at Fulcio for a short-lived
      # certificate and the signature is recorded in the public Rekor log. No signing
      # key exists anywhere -- not in secrets, not in KMS, not on the host. Signs the
      # immutable digest, never the tag.
      - name: Sign the image digest with Cosign (keyless)
        run: |
          cosign sign --yes \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}@${{ steps.push.outputs.digest }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws

      - name: Target the requested instance
        run: |
          sed -i "s/tag:Name: .*/tag:Name: ${{ inputs.instance_name }}/" ansible/aws_ec2.yml

      - name: Deploy via Ansible over SSM
        run: |
          ansible-playbook -i ansible/aws_ec2.yml ansible/deploy.yml \
            -e "new_image_ref=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}@${{ steps.push.outputs.digest }}"

name: Bootstrap (one time)
run-name: "bootstrap · ${{ inputs.confirm }}"

# Runs ONCE, from Actions, never locally.
#
# The chicken-and-egg: infra-provision-role has no IAM write permissions and
# cannot grant them to itself, so something wider has to act first. deploy-role
# currently carries AdministratorAccess -- the largest hole in this account --
# so this job borrows it exactly once, and the platform apply's final act is
# detaching it. The hole closes itself.
#
# After a successful run, delete this file. It cannot work a second time.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type BOOTSTRAP to proceed."
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unless explicitly confirmed
        run: |
          [ "${{ inputs.confirm }}" = "BOOTSTRAP" ] \
            || { echo "::error::Confirmation did not match. Nothing changed."; exit 1; }

      - uses: actions/checkout@v4

      # deploy-role, not infra-provision-role: this is the one run needing
      # permissions infra-provision-role does not yet have.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::148737623247:role/deploy-role
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Apply the platform stack (detaches AdministratorAccess last)
        working-directory: infra/terraform/platform
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Confirm the hole is closed
        run: |
          set -euo pipefail
          ATTACHED=$(aws iam list-attached-role-policies --role-name deploy-role \
            --query 'AttachedPolicies[].PolicyName' --output text)
          if [ -n "$ATTACHED" ]; then
            echo "::error::deploy-role still has: $ATTACHED"
            exit 1
          fi
          {
            echo "### Bootstrap complete"
            echo "- \`deploy-role\` no longer holds AdministratorAccess"
            echo "- \`infra-provision-role\` can now run the pipelines"
            echo
            echo "**Delete \`.github/workflows/bootstrap.yml\` — it cannot run again.**"
          } >> "$GITHUB_STEP_SUMMARY"

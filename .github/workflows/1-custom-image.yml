name: 1 · Custom Image
run-name: "custom-image · ${{ inputs.environment || 'dev' }}"

# Bakes the custom image with Packer and hands the AMI id to the next pipeline.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: dev
    outputs:
      ami_id:
        description: "AMI built by this run."
        value: ${{ jobs.build.outputs.ami_id }}
  workflow_dispatch:
    inputs:
      environment:
        type: string
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ami_id: ${{ steps.build.outputs.ami_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::148737623247:role/infra-provision-role
          aws-region: us-east-2

      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "latest"

      - name: Packer build
        id: build
        working-directory: infra/packer
        run: |
          set -o pipefail
          packer init .
          packer build -machine-readable . | tee build.log
          AMI_ID=$(grep ',artifact,0,id,' build.log | tail -1 | cut -d, -f6 | cut -d: -f2)
          if [ -z "$AMI_ID" ]; then
            echo "::error::No AMI id in packer output"
            exit 1
          fi
          echo "ami_id=$AMI_ID" >> "$GITHUB_OUTPUT"
          echo "### Custom image: \`$AMI_ID\`" >> "$GITHUB_STEP_SUMMARY"

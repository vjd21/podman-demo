name: GHCR Policy Test (isolated)

on:
  workflow_dispatch:

# Isolated proof-of-concept: pushes and signs a test image to GHCR to check
# whether podman's native policy.json signature verification works there,
# since it's broken against ECR. Does not touch the production pipeline,
# the production ECR repo, or the deployed server.
permissions:
  id-token: write
  contents: read
  packages: write

env:
  AWS_REGION: us-east-2
  GHCR_IMAGE: ghcr.io/vjd21/podman-demo-policy-test

jobs:
  ghcr-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::148737623247:role/deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build test image with Podman
        run: |
          podman build -t ${{ env.GHCR_IMAGE }}:test .

      - name: Push test image to GHCR
        id: push
        run: |
          podman push --digestfile digest.txt ${{ env.GHCR_IMAGE }}:test
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"

      - name: Sign the GHCR image with the existing KMS key
        run: |
          cosign sign --key awskms:///alias/podman-demo-cosign --yes ${{ env.GHCR_IMAGE }}@${{ steps.push.outputs.digest }}

      - name: Print result
        run: |
          echo "Pushed and signed: ${{ env.GHCR_IMAGE }}@${{ steps.push.outputs.digest }}"

      - name: Configure a test podman policy for this runner only
        run: |
          sudo mkdir -p /etc/pki/containers
          sudo cp server-config/cosign.pub /etc/pki/containers/cosign.pub
          sudo tee /etc/containers/policy.json > /dev/null << POLEOF
          {
            "default": [{"type": "reject"}],
            "transports": {
              "docker": {
                "${{ env.GHCR_IMAGE }}": [
                  {
                    "type": "sigstoreSigned",
                    "keyPath": "/etc/pki/containers/cosign.pub",
                    "signedIdentity": {"type": "matchRepository"}
                  }
                ]
              }
            }
          }
          POLEOF
          sudo mkdir -p /etc/containers/registries.d
          printf 'docker:\n  ghcr.io:\n    use-sigstore-attachments: true\n' | sudo tee /etc/containers/registries.d/ghcr-test.yaml

      - name: Verify podman's native policy.json enforcement against GHCR
        run: |
          sudo podman pull ${{ env.GHCR_IMAGE }}@${{ steps.push.outputs.digest }}
          echo "RESULT: podman's native policy.json verification PASSED against GHCR."

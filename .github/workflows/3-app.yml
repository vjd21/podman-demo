name: 3 · Application
run-name: "app v1.0.${{ github.run_number }} · ${{ inputs.environment }}"

# Builds and signs the image once, then deploys that one signed digest to every
# target the infrastructure pipeline handed over.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: dev
      targets:
        description: "JSON list from the infrastructure pipeline."
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        type: string
        default: dev
      targets:
        description: 'JSON list, e.g. [{"tenant":"demo","name":"dev-demo","port":8081}]'
        type: string
        required: true

permissions:
  id-token: write
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_REPOSITORY: vjd21/podman-demo
  IMAGE_VERSION: v1.0.${{ github.run_number }}
  COSIGN_KMS_KEY: awskms:///alias/podman-demo-cosign

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.5'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::148737623247:role/deploy-role
          aws-region: us-east-2

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          podman build -f app/Containerfile app \
            -t ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${{ env.IMAGE_VERSION }} \
            --label org.opencontainers.image.version=${{ env.IMAGE_VERSION }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Push
        id: push
        run: |
          set -euo pipefail
          podman push --digestfile digest.txt ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${{ github.sha }}
          podman push --digestfile version.txt ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${{ env.IMAGE_VERSION }}
          # Both tags are one manifest, so they must resolve to one digest --
          # otherwise only one of them is covered by the signature below.
          diff -q digest.txt version.txt >/dev/null \
            || { echo "::error::tags pushed different digests"; exit 1; }
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"

      - name: Sign (keyless)
        run: cosign sign --yes ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}@${{ steps.push.outputs.digest }}

      - name: Sign (AWS KMS)
        run: cosign sign --yes --key ${{ env.COSIGN_KMS_KEY }} ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}@${{ steps.push.outputs.digest }}

      # Never committed -- exported from KMS every run, so it cannot drift from
      # the key that actually signed the image.
      - name: Export the KMS public key
        run: |
          cosign public-key --key ${{ env.COSIGN_KMS_KEY }} > cosign.pub
          test -s cosign.pub

      - uses: actions/upload-artifact@v4
        with:
          name: cosign-public-key
          path: cosign.pub
          retention-days: 1

  deploy:
    needs: build-and-sign
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cosign-public-key
          path: ${{ runner.temp }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::148737623247:role/deploy-role
          aws-region: us-east-2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          pip install --quiet ansible boto3 botocore
          ansible-galaxy collection install amazon.aws

      # Generated, not committed: every value is derived from the target, so
      # there is nothing to keep in sync by hand.
      - name: Generate inventory
        run: |
          cat > "${{ runner.temp }}/inventory.aws_ec2.yml" <<EOF
          plugin: amazon.aws.aws_ec2
          regions:
            - us-east-2
          filters:
            tag:Name: ${{ matrix.name }}
            instance-state-name: running
          compose:
            ansible_connection: "'amazon.aws.aws_ssm'"
            ansible_aws_ssm_region: "'us-east-2'"
            ansible_aws_ssm_bucket_name: "'sriharis3bucket'"
          hostnames:
            - instance-id
          EOF

      - name: Deploy over SSM
        run: |
          ansible-playbook -i "${{ runner.temp }}/inventory.aws_ec2.yml" deploy/ansible/deploy.yml \
            -e "new_image_ref=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}@${{ needs.build-and-sign.outputs.digest }}" \
            -e "cosign_public_key_path=${{ runner.temp }}/cosign.pub" \
            -e "app_port=${{ matrix.port }}"

      - name: Summarise
        run: |
          {
            echo "### ${{ matrix.name }} · ${{ env.IMAGE_VERSION }}"
            echo "- digest \`${{ needs.build-and-sign.outputs.digest }}\`"
            echo "- port \`${{ matrix.port }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

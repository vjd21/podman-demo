---
- name: Deploy Podman Application
  hosts: all
  gather_facts: false
  tasks:
    - name: Require an immutable digest reference
      assert:
        that:
          - new_image_ref is defined
          - "'@sha256:' in new_image_ref"
        fail_msg: >-
          new_image_ref must pin an immutable digest (repo@sha256:...), never a
          mutable tag. Got: {{ new_image_ref | default('undefined') }}

    - name: Read podman version
      register: podman_version
      changed_when: false
      shell: podman --version | awk '{print $3}'

    - name: Require a podman that supports Quadlet
      assert:
        that:
          - podman_version.stdout is version('4.4', '>=')
        fail_msg: >-
          podman {{ podman_version.stdout }} does not support Quadlet
          (.container units); 4.4 or newer is required.

    # Must match the version the workflow signs with, so the signature format
    # written in CI is the format verified here.
    - name: Install Cosign
      vars:
        cosign_version: "v3.1.3"
      shell: |
        set -euo pipefail
        if command -v cosign &> /dev/null && cosign version 2>/dev/null | grep -q "{{ cosign_version }}"; then
          exit 0
        fi
        cd /tmp
        curl -fsSL -O https://github.com/sigstore/cosign/releases/download/{{ cosign_version }}/cosign-linux-amd64
        curl -fsSL -O https://github.com/sigstore/cosign/releases/download/{{ cosign_version }}/cosign_checksums.txt
        sha256sum --ignore-missing -c cosign_checksums.txt
        sudo install -m 0755 cosign-linux-amd64 /usr/local/bin/cosign
        rm -f cosign-linux-amd64 cosign_checksums.txt
      args:
        executable: /bin/bash

    - name: Upload Podman policy to tmp
      copy:
        src: ../server-config/policy.json
        dest: /tmp/policy.json
        mode: "0644"

    # Deny-by-default: nothing outside ghcr.io/vjd21/podman-demo can be pulled at all.
    # The signature check itself cannot live here -- see the Quadlet unit's ExecStartPre.
    - name: Apply Podman policy
      shell: |
        sudo install -m 0644 /tmp/policy.json /etc/containers/policy.json
        rm -f /tmp/policy.json

    # The GHCR package is currently public, so pulls need no credentials. Pass
    # -e ghcr_username=... -e ghcr_token=... to authenticate if it is made private.
    - name: Authenticate Podman with GHCR
      when: ghcr_token is defined
      no_log: true
      shell: |
        sudo mkdir -p /root/.docker
        echo "{{ ghcr_token }}" | sudo podman login ghcr.io \
          --username "{{ ghcr_username }}" --password-stdin \
          --authfile /root/.docker/config.json

    # Not a security gate (policy is an allow-list); this just surfaces network or
    # auth failures before the running container is touched.
    - name: Pre-pull the image
      register: pull_result
      ignore_errors: true
      changed_when: pull_result.rc == 0
      shell: |
        sudo podman pull {{ new_image_ref }}

    - name: Fail the play if the image could not be pulled
      when: pull_result is failed
      fail:
        msg: >-
          Could not pull {{ new_image_ref }}. The previous container is untouched
          and still running. Error: {{ pull_result.stderr | default('(no stderr)') }}

    - name: Render Quadlet Service File
      template:
        src: ../server-config/podman-demo.container.j2
        dest: /tmp/podman-demo.container
        mode: "0644"

    - name: Install Quadlet Service File
      shell: |
        sudo install -m 0644 /tmp/podman-demo.container /etc/containers/systemd/podman-demo.container
        rm -f /tmp/podman-demo.container

    # ExecStartPre runs cosign verify here; if the signature or identity is wrong the
    # unit fails and the container never starts.
    - name: Start the verified image
      register: start_result
      ignore_errors: true
      shell: |
        sudo systemctl daemon-reload
        sudo systemctl stop podman-demo.service || true
        sudo systemctl start podman-demo.service

    - name: Gather failure diagnostics
      when: start_result is failed
      register: diagnostics
      changed_when: false
      shell: |
        echo "########## systemctl status ##########"
        sudo systemctl status podman-demo.service --no-pager || true
        echo "########## journalctl (last 100 lines) ##########"
        sudo journalctl -u podman-demo.service -n 100 --no-pager || true

    - name: Show failure diagnostics
      when: start_result is failed
      debug:
        var: diagnostics.stdout_lines

    - name: Fail the play if the deployment did not start
      when: start_result is failed
      fail:
        msg: "podman-demo.service failed to start -- see diagnostics above for the root cause."

    - name: Verify the container is running
      register: run_check
      until: run_check.rc == 0
      retries: 5
      delay: 3
      changed_when: false
      shell: |
        sudo systemctl is-active --quiet podman-demo.service
        sudo podman ps --filter name=systemd-podman-demo --filter status=running \
          | grep -q systemd-podman-demo

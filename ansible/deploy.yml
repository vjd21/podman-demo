---
- name: Deploy Podman Application
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Cosign
      shell: |
        if ! command -v cosign &> /dev/null; then
          sudo wget -O /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          sudo chmod +x /usr/local/bin/cosign
        fi

    - name: Create Quadlet Service File
      shell: |
        cat << 'EOF' | sudo tee /etc/containers/systemd/podman-demo.container
        [Unit]
        Description=Podman Security Demo Container
        After=network-online.target

        [Service]
        ExecStartPre=/usr/local/bin/cosign verify --certificate-identity "https://github.com/vjd21/podman-demo/.github/workflows/deploy.yml@refs/heads/main" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" 148737623247.dkr.ecr.us-east-2.amazonaws.com/podman-demo:{{ new_git_sha }}

        [Container]
        Image=148737623247.dkr.ecr.us-east-2.amazonaws.com/podman-demo:{{ new_git_sha }}
        PublishPort=8081:80

        [Install]
        WantedBy=default.target
        EOF
      
    - name: Upload Podman Configs to tmp
      copy:
        src: ../server-config/{{ item }}
        dest: /tmp/{{ item }}
      loop:
        - policy.json
        - registries.yaml

    - name: Apply Podman Configs
      shell: |
        sudo mv /tmp/policy.json /etc/containers/policy.json
        sudo mv /tmp/registries.yaml /etc/containers/registries.d/podman-demo.yaml

    - name: Authenticate Podman with AWS ECR
      shell: |
        sudo aws ecr get-login-password --region us-east-2 | sudo podman login --username AWS --password-stdin 148737623247.dkr.ecr.us-east-2.amazonaws.com
        sudo mkdir -p /root/.docker
        sudo aws ecr get-login-password --region us-east-2 | sudo podman login --authfile /root/.docker/config.json --username AWS --password-stdin 148737623247.dkr.ecr.us-east-2.amazonaws.com
      
    - name: Start Podman application
      shell: |
        sudo systemctl daemon-reload
        sudo systemctl stop podman-demo.service || true
        sudo systemctl start podman-demo.service

---
- name: Deploy Podman Application
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Cosign
      vars:
        cosign_version: "v3.1.3"
      shell: |
        set -euo pipefail
        if command -v cosign &> /dev/null && cosign version 2>/dev/null | grep -q "{{ cosign_version }}"; then
          exit 0
        fi
        cd /tmp
        curl -fsSL -O https://github.com/sigstore/cosign/releases/download/{{ cosign_version }}/cosign-linux-amd64
        curl -fsSL -O https://github.com/sigstore/cosign/releases/download/{{ cosign_version }}/cosign_checksums.txt
        sha256sum --ignore-missing -c cosign_checksums.txt
        sudo install -m 0755 cosign-linux-amd64 /usr/local/bin/cosign
        rm -f cosign-linux-amd64 cosign_checksums.txt
      args:
        executable: /bin/bash

    - name: Render Quadlet Service File
      template:
        src: ../server-config/podman-demo.container.j2
        dest: /tmp/podman-demo.container
        mode: "0644"

    - name: Install Quadlet Service File
      shell: |
        sudo mv /tmp/podman-demo.container /etc/containers/systemd/podman-demo.container

    - name: Upload Podman Configs to tmp
      copy:
        src: ../server-config/{{ item }}
        dest: /tmp/{{ item }}
      loop:
        - policy.json
        - registries.yaml
        - cosign.pub

    - name: Apply Podman Configs
      shell: |
        sudo mv /tmp/policy.json /etc/containers/policy.json
        sudo mv /tmp/registries.yaml /etc/containers/registries.d/podman-demo.yaml
        sudo mkdir -p /etc/pki/containers
        sudo mv /tmp/cosign.pub /etc/pki/containers/cosign.pub

    - name: Authenticate Podman with AWS ECR
      shell: |
        sudo aws ecr get-login-password --region us-east-2 | sudo podman login --username AWS --password-stdin 148737623247.dkr.ecr.us-east-2.amazonaws.com
        sudo mkdir -p /root/.docker
        sudo aws ecr get-login-password --region us-east-2 | sudo podman login --authfile /root/.docker/config.json --username AWS --password-stdin 148737623247.dkr.ecr.us-east-2.amazonaws.com
      
    - name: Start Podman application
      shell: |
        sudo systemctl daemon-reload
        sudo systemctl stop podman-demo.service || true
        sudo systemctl start podman-demo.service

---
- name: Deploy Podman Application
  hosts: all
  gather_facts: false
  tasks:
    - name: Create Quadlet Service File
      shell: |
        cat << 'EOF' | sudo tee /etc/containers/systemd/podman-demo.container
        [Unit]
        Description=Podman Security Demo Container
        After=network-online.target

        [Container]
        Image=148737623247.dkr.ecr.us-east-2.amazonaws.com/podman-demo:{{ new_git_sha }}
        PublishPort=8081:80

        [Install]
        WantedBy=default.target
        EOF
      
    - name: Upload Podman Configs to tmp
      copy:
        src: ../server-config/{{ item }}
        dest: /tmp/{{ item }}
      loop:
        - policy.json
        - registries.yaml

    - name: Apply Podman Configs
      shell: |
        sudo mv /tmp/policy.json /etc/containers/policy.json
        sudo mv /tmp/registries.yaml /etc/containers/registries.d/podman-demo.yaml

    - name: Authenticate Podman with AWS ECR
      shell: |
        sudo aws ecr get-login-password --region us-east-2 | sudo podman login --username AWS --password-stdin 148737623247.dkr.ecr.us-east-2.amazonaws.com
      
    - name: Start Podman application
      shell: |
        sudo systemctl daemon-reload
        sudo systemctl stop podman-demo.service || true
        sudo systemctl start podman-demo.service

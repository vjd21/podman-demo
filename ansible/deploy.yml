---
- name: Deploy Podman Application
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure configuration directory exists
      shell: sudo mkdir -p /etc/podman-demo

    - name: Update environment file
      shell: |
        echo "APP_IMAGE=148737623247.dkr.ecr.us-east-2.amazonaws.com/podman-demo:{{ new_git_sha }}" | sudo tee /etc/podman-demo/image.env
      
    - name: Authenticate Podman with AWS ECR
      shell: |
        sudo aws ecr get-login-password --region us-east-2 | sudo podman login --username AWS --password-stdin 148737623247.dkr.ecr.us-east-2.amazonaws.com
      
    - name: Restart Podman application
      shell: |
        sudo systemctl daemon-reload
        sudo systemctl restart podman-demo
